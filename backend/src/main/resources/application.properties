
spring.application.name=vibesphere-api
server.port=8080
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vibesphere_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT_SECRET must be provided and contain at least 32 bytes.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# Web session cookie
app.auth.cookie-name=vs_session
app.auth.cookie-secure=${COOKIE_SECURE:false}
app.auth.cookie-same-site=Lax
app.auth.cookie-path=/api

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=${UPLOAD_DIR:./uploads}

server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.hibernate.SQL=warn
